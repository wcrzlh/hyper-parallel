# Eight-rank text packing smoke: GDN P2P + full-attention KV all-gather.
# Full attention consumes cu_seq_lens through NPU varlen attention; no quadratic document mask.
# For a dense reference, use sdpa_hf_cp_wrapper and attention_mode: dense below.
# Decoder patterns assume the released 40-layer schedule: every fourth layer is full attention.

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /home/chaoran/models/Qwen3.6-35B-A3B
  ignore_mismatched_sizes: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true
  config_overrides:
    use_cache: false

training:
  train_iters: 100
  train_samples: null
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 2
  ep_size: 2
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  wrapper_class:
    - Qwen3_5MoeDecoderLayer
    - Embedding
  dp_shard_size: 8
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
  edp_shard_size: 4
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match: "*.linear_attn"
    replace:
      kind: module
      source_type: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe.Qwen3_5MoeGatedDeltaNet
      exact_type: true
      implementation:
        _target_: hyper_parallel.components.modules.TritonGDN
  - match: "*.mlp.experts"
    replace:
      kind: module
      source_type: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe.Qwen3_5MoeExperts
      exact_type: true
      implementation:
        _target_: hyper_parallel.components.modules.GroupedExperts
  - match: "*.mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_5_moe.adapter.distributed.expert_parallel.qwen3_5_moe_ep_compute_fn
        use_grouped_gemm: true
  - match: "*.linear_attn.forward"
    when: cp
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_5.adapter.distributed.context_parallel.qwen3_5_gdn_p2p_cp_wrapper
        backend: triton
        chunk_size: 64
  - match: "*.self_attn.forward"
    when: cp
    replace:
      kind: method
      implementation: hyper_parallel.distributed.context_parallel.packed_attention.packed_allgather_hf_cp_wrapper
  # Linear HF decoders otherwise discard packed metadata before calling the mixer.
  # Match only linear decoders; never wrap the full-attention decoder with this rule.
  - &packed_decoder
    match: "model.layers.[01245689].forward"
    when: cp
    params: {}
    in_src:
      hidden_states: {tp: replicate, cp: "shard(1)", ep: replicate}
    in_dst:
      hidden_states: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_src: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_dst: {tp: replicate, cp: "shard(1)", ep: replicate}
    replace:
      kind: method
      implementation: hyper_parallel.models.qwen3_5.adapter.distributed.context_parallel.qwen3_5_packed_decoder_wrapper
  - <<: *packed_decoder
    match: "model.layers.[13][0234678].forward"
  - <<: *packed_decoder
    match: "model.layers.2[01245689].forward"

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  model_assets:
    chat_template: tokenizer
    chat_template_kwargs:
      reasoning_effort: medium
      preserve_thinking: true
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: /home/chaoran/models/Qwen3.6-35B-A3B
      local_files_only: true
      use_fast: true
      trust_remote_code: false
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: sharegpt
    thinking_mode: auto
    text_keys: messages
    max_seq_len: 32768
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: /home/chaoran/datasets/decif-30k.jsonl
  data_config:
    dataset_type: mapping
    hf_dataset_name: null
    create_attention_mask_in_dataloader: true
    labels_are_shifted: true

dataloader:
  _target_: hyper_parallel.data.batching.TokenBatchLoader
  token_budget: 32768
  min_buffered_samples: 16
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
    pad_to_length: 32768
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: packed_text
    attention_mode: compressed
    runtime_input_adapter:
      _target_: hyper_parallel.models.qwen3_5.adapter.data.runtime.Qwen35PackedRuntime
  sampler_type: cyclic
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

loss_fn:
  _target_: hyper_parallel.components.losses.ChunkedCausalLMLoss
  chunk_size: 1024

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 0
    min_lr: 1.0e-6

checkpoint:
  save_ckpt: false
  save_hf_weights: false
  checkpoint_dir: ./outputs/qwen3_6_moe/packing/checkpoints
  save_steps: 10
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  save_extra_state_per_rank: true
  restore_from: null
  restore_optimizer: true
  restore_train_state: true

debug:
  log_first_rendered_template: true
  check_nan_inf: false
  check_dataset: null

profiler:
  enable: false
  start_step: 3
  stop_step: 4
  output_path: ./outputs/qwen3_6_moe/packing/profiling
  memory: false
  with_stack: false
  rank_ids: [0]
