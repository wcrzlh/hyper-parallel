# Qwen3.6 MLA: FSDP + EP + GDN P2P + attention KV all-gather CP.

# Default launcher: 16 ranks, CP=2, DP=8, EP=2, GBS=16, MBS=1.
# MLA all-gather communicates reconstructed K/V, not the compressed latent.
# Remote-code assets and all checkpoint shards must already exist locally.
model_init_dtype: float32

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /home/ma-user/work/w00824760/Qwen3.6-35B-A3B-kvfirst-mla-gkd-thinking
  ignore_mismatched_sizes: false
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true
  trust_remote_code: true
  local_files_only: true
  config_overrides:
    use_cache: false

training:
  train_iters: 100
  train_samples: null
  global_batch_size: 16
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 2
  # Split the 256 routed experts across two ranks in each EP group.
  ep_size: 2
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  wrapper_class:
    - Qwen3_5MoeDecoderLayer
    - Embedding
  dp_shard_size: 8
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
  # At world size 16, EDP=8 x EP=2; shard each expert partition over
  # four EDP ranks and replicate it twice.
  edp_shard_size: 4
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  # Remote-code classes differ from installed HF classes; factories check structure.
  - match: "*.linear_attn"
    replace:
      kind: module
      source_type: torch.nn.Module
      implementation:
        _target_: hyper_parallel.components.modules.TritonGDN
  - match: "*.mlp.experts"
    replace:
      kind: module
      source_type: torch.nn.Module
      implementation:
        _target_: hyper_parallel.components.modules.GroupedExperts
  - match: "*.mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_5_moe.adapter.distributed.expert_parallel.qwen3_5_moe_ep_compute_fn
        use_grouped_gemm: true
  - match: "*.linear_attn.forward"
    when: cp
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_5.adapter.distributed.context_parallel.qwen3_5_gdn_p2p_cp_wrapper
        backend: triton
        chunk_size: 64
  - match: "*.self_attn.forward"
    when: cp
    replace:
      kind: method
      implementation: hyper_parallel.distributed.context_parallel.wrappers.sdpa_hf_cp_wrapper

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  model_assets:
    chat_template: tokenizer
    chat_template_kwargs:
      reasoning_effort: medium
      # Keep historical reasoning so incremental loss-mask boundaries remain stable.
      preserve_thinking: true
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: /home/ma-user/work/w00824760/Qwen3.6-35B-A3B-kvfirst-mla-gkd-thinking
      local_files_only: true
      use_fast: true
      trust_remote_code: true
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: sharegpt
    thinking_mode: auto
    text_keys: messages
    max_seq_len: 32768
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: /home/ma-user/work/w00824760/datasets/decif-30k.jsonl
  data_config:
    dataset_type: mapping
    hf_dataset_name: null
    create_attention_mask_in_dataloader: false
    labels_are_shifted: true

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    # Align each contiguous CP shard to the fused GDN kernel chunk size.
    _target_: hyper_parallel.models.qwen3_5.cp_batch.GDNCPDataCollator
    chunk_size: 64
  get_batch:
    # The remote text model accepts a Tensor/None mask, not the newer HF mask dictionary.
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: dense
    runtime_input_adapter:
      _target_: hyper_parallel.models.qwen3_5.adapter.data.runtime.Qwen35PackedRuntime
  sampler_type: cyclic
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

loss_fn:
  _target_: hyper_parallel.components.losses.ChunkedCausalLMLoss
  chunk_size: 1024

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 0
    min_lr: 1.0e-6

checkpoint:
  save_ckpt: false
  save_hf_weights: false
  checkpoint_dir: ./outputs/qwen3_6_mla/p2p_kv_allgather/checkpoints
  save_steps: 10
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  save_extra_state_per_rank: false
  restore_from: null
  restore_optimizer: true
  restore_train_state: true

debug:
  log_first_rendered_template: true
  check_nan_inf: false
  check_dataset: null

profiler:
  enable: false
  start_step: 3
  stop_step: 4
  output_path: ./outputs/qwen3_6_mla/p2p_kv_allgather/profiling
  memory: false
  with_stack: false
  rank_ids: [0]
